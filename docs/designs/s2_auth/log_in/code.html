<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

margin-mobile":"1rem","space-xl":"2rem","space-xs":"0.25rem","gutter-mobile":"1rem","margin":"2rem"},"fontFamily":{"body-md-semibold":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"body-sm-medium":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"headline-xl-mobile":["Plus Jakarta Sans"],"headline-sm":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"headline-xl":["Plus Jakarta Sans"]},"fontSize":{"body-md-semibold":["16px",{"lineHeight":"24px","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"body-sm":["14px",{"lineHeight":"20px","fontWeight":"400"}],"label-md":["13px",{"lineHeight":"18px","letterSpacing":"0.01em","fontWeight":"600"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.015em","fontWeight":"700"}],"body-sm-medium":["14px",{"lineHeight":"20px","fontWeight":"500"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-lg-mobile":["26px",{"lineHeight":"34px","letterSpacing":"-0.01em","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-xl-mobile":["30px",{"lineHeight":"38px","letterSpacing":"-0.015em","fontWeight":"700"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"16px","letterSpacing":"0.03em","fontWeight":"600"}],"headline-xl":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"700"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface"><main class="w-full min-h-screen bg-surface"><div class="flex flex-col w-full">
<div class="flex flex-col lg:flex-row w-full min-h-[calc(100vh)]">
<!-- Left Panel: Warm Cream Heritage Canvas -->
<section class="w-full lg:w-1/2 bg-surface flex flex-col justify-between p-8 lg:p-12 relative overflow-hidden">
<!-- Subtle ambient tonal glow -->
<div class="absolute -bottom-24 -left-24 w-96 h-96 rounded-full bg-primary-container/5 blur-3xl pointer-events-none"></div>
<!-- Top-Left: Lefa Logo Mark + Wordmark -->
<div class="relative z-10 flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center text-on-primary shadow-sm">
<svg aria-hidden="true" fill="none" height="22" viewbox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2.5L4.5 6V11.5C4.5 16.4 7.7 20.9 12 22C16.3 20.9 19.5 16.4 19.5 11.5V6L12 2.5Z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M12 8.5V15.5M9.5 12.5C9.5 10.8 10.6 9.5 12 9.5C13.4 9.5 14.5 10.8 14.5 12.5" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path>
</svg>
</div>
<span class="font-headline-md text-headline-md text-primary-container tracking-tight">Lefa</span>
</div>
<!-- Center: Editorial Illustration & Quote -->
<div class="relative z-10 flex flex-col items-center text-center my-12 lg:my-0 max-w-md mx-auto">
<div class="w-full max-w-[280px] rounded-xl overflow-hidden shadow-md bg-surface-container-low mb-8">
<img alt="Warm minimalist editorial illustration of a protective family home and secure keyhole shield with botanical leaves" class="w-full h-auto object-cover block" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAnvKboCCu-D9BwGQGAel3_bN5zsqv3Ni7Fo6vno7XP8vF1Ri20iuJEqeTXiWQbX0fQLox5oaEpZZSeU6euxS_UYbm3lZG7LNES27Q2gTiCQ1ByxBZRBykjrwCPAYZYyujcp8Ed0yi5NZ_2ZLYRU40frlnAOrS0NNFcd0M-stU_fCEZ9EuueGBanL-od-uDyFt0hUz7lgVnIbGscNacrQJOz4p99B1Ex1ImQv2CqtEw"/>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface max-w-sm">
          Make sure your cover reaches your family
        </h2>
</div>
<!-- Bottom: Subtle Trust Note -->
<div class="relative z-10 flex items-center justify-center lg:justify-start gap-2 text-on-surface-variant">
<span aria-hidden="true" class="material-symbols-outlined text-[16px] text-secondary">lock</span>
<span class="font-body-sm text-body-sm">Bank-grade AES-256 encryption • POPIA compliant</span>
</div>
</section>
<!-- Right Panel: Pure Surface White Form -->
<section class="w-full lg:w-1/2 bg-surface-container-lowest flex items-center justify-center p-8 lg:p-16">
<div class="w-full max-w-[400px] flex flex-col">
<!-- Heading & Subtext -->
<div class="mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
            Sign in to access your family policy vault.
          </p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5" id="lefa-login-form" novalidate="">
<!-- Field 1: Email -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">
              Email
            </label>
<input autocomplete="email" class="w-full h-12 px-4 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_rgba(31,95,74,0.28)] transition-all" id="email" name="email" placeholder="thabo@example.co.za" required="" type="email"/>
</div>
<!-- Field 2: Password -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">
                Password
              </label>
<a class="font-body-sm-medium text-body-sm-medium text-primary-container hover:text-primary transition-colors" href="#forgot-password">
                Forgot password?
              </a>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-4 pr-12 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_rgba(31,95,74,0.28)] transition-all" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 p-1.5 rounded-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors flex items-center justify-center" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<!-- Inline feedback message -->
<div class="hidden rounded-lg px-4 py-3 font-body-sm text-body-sm bg-error-container text-on-error-container" id="form-feedback"></div>
<!-- Primary Submit Button -->
<button class="w-full h-12 mt-2 rounded-lg bg-primary-container hover:bg-primary text-on-primary font-body-md-semibold text-body-md-semibold shadow-sm hover:shadow transition-all flex items-center justify-center gap-2 cursor-pointer" type="submit">
<span>Log in</span>
</button>
</form>
<!-- Bottom Sign Up Link -->
<p class="mt-8 text-center font-body-md text-body-md text-on-surface-variant">
          Don’t have a vault?
          <a class="font-body-md-semibold text-body-md-semibold text-primary-container hover:text-primary transition-colors ml-1" href="#sign-up">
            Sign up
          </a>
</p>
</div>
</section>
</div>
</div>
<script>
  (function () {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const toggleIcon = document.getElementById('toggle-password-icon');
    const form = document.getElementById('lefa-login-form');
    const feedback = document.getElementById('form-feedback');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (form && feedback) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const emailVal = document.getElementById('email').value.trim();
        const passVal = passwordInput.value;

        if (!emailVal || !passVal) {
          feedback.textContent = 'Please enter both your email address and password.';
          feedback.classList.remove('hidden', 'bg-primary-fixed', 'text-on-primary-fixed');
          feedback.classList.add('bg-error-container', 'text-on-error-container');
          return;
        }

        feedback.textContent = 'Verifying your encrypted vault credentials...';
        feedback.classList.remove('hidden', 'bg-error-container', 'text-on-error-container');
        feedback.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
      });
    }
  })();
</script></main></body></html>
