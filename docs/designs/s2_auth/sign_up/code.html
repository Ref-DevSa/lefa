<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-tertiary-container":"#99cfff","on-surface-variant":"#404944","on-background":"#1c1c19","surface":"#fcf9f4","error":"#ba1a1a","background":"#fcf9f4","primary-container":"#1f5f4a","outline":"#707974","secondary-container":"#fdbe58","surface-variant":"#e5e2dd","on-secondary-fixed-variant":"#614000","inverse-primary":"#94d4b9","tertiary-fixed-dim":"#94ccfd","on-surface":"#1c1c19","primary":"#004734","inverse-on-surface":"#f3f0eb","surface-container-high":"#ebe8e3","secondary-fixed":"#ffddaf","surface-container":"#f0ede9","on-secondary":"#ffffff","on-tertiary-fixed":"#001d31","on-tertiary-fixed-variant":"#004b73","on-secondary-container":"#724d00","surface-container-low":"#f6f3ee","tertiary-fixed":"#cce5ff","on-error-container":"#93000a","error-container":"#ffdad6","primary-fixed-dim":"#94d4b9","outline-variant":"#bfc9c2","surface-container-highest":"#e5e2dd","surface-bright":"#fcf9f4","on-primary-fixed":"#002116","surface-container-lowest":"#ffffff","inverse-surface":"#31302d","tertiary-container":"#165984","on-primary-fixed-variant":"#0a513d","on-secondary-fixed":"#281800","on-error":"#ffffff","on-primary-container":"#97d7bc","on-tertiary":"#ffffff","surface-dim":"#dcdad5","tertiary":"#004165","surface-tint":"#2b6953","secondary-fixed-dim":"#fabc56","primary-fixed":"#b0f0d4","secondary":"#805600","on-primary":"#ffffff"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"space-md":"1rem","space-lg":"1.5rem","gutter":"1.5rem","space-sm":"0.5rem","margin-mobile":"1rem","space-xl":"2rem","space-xs":"0.25rem","gutter-mobile":"1rem","margin":"2rem"},"fontFamily":{"body-md-semibold":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"body-sm-medium":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"headline-xl-mobile":["Plus Jakarta Sans"],"headline-sm":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"headline-xl":["Plus Jakarta Sans"]},"fontSize":{"body-md-semibold":["16px",{"lineHeight":"24px","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"body-sm":["14px",{"lineHeight":"20px","fontWeight":"400"}],"label-md":["13px",{"lineHeight":"18px","letterSpacing":"0.01em","fontWeight":"600"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.015em","fontWeight":"700"}],"body-sm-medium":["14px",{"lineHeight":"20px","fontWeight":"500"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-lg-mobile":["26px",{"lineHeight":"34px","letterSpacing":"-0.01em","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-xl-mobile":["30px",{"lineHeight":"38px","letterSpacing":"-0.015em","fontWeight":"700"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"16px","letterSpacing":"0.03em","fontWeight":"600"}],"headline-xl":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"700"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface"><main class="w-full min-h-screen bg-surface"><div class="flex flex-col w-full">
<div class="grid grid-cols-1 lg:grid-cols-2 w-full min-h-[840px]">
<!-- Left Panel: Brand & Editorial Assurance -->
<section class="bg-surface flex flex-col justify-between p-8 lg:p-12 xl:p-16">
<!-- Top-left Brand Mark -->
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-primary-container flex items-center justify-center text-on-primary shadow-sm">
<svg aria-hidden="true" class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
<path d="M12 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path>
<path d="M12 11v4"></path>
</svg>
</div>
<span class="font-headline-sm text-headline-sm text-primary-container tracking-tight">Lefa</span>
</div>
<!-- Center Illustration & Quote -->
<div class="flex flex-col items-center text-center my-12 lg:my-0">
<div class="w-full max-w-[280px] rounded-xl overflow-hidden shadow-md bg-surface-container-low mb-8">
<img alt="Warm minimalist editorial illustration of a protective family home and secure keyhole shield" class="w-full h-auto object-cover block" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAnvKboCCu-D9BwGQGAel3_bN5zsqv3Ni7Fo6vno7XP8vF1Ri20iuJEqeTXiWQbX0fQLox5oaEpZZSeU6euxS_UYbm3lZG7LNES27Q2gTiCQ1ByxBZRBykjrwCPAYZYyujcp8Ed0yi5NZ_2ZLYRU40frlnAOrS0NNFcd0M-stU_fCEZ9EuueGBanL-od-uDyFt0hUz7lgVnIbGscNacrQJOz4p99B1Ex1ImQv2CqtEw"/>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface max-w-[360px]">
          Make sure your cover reaches your family
        </h2>
</div>
<!-- Bottom Trust Note -->
<div class="flex items-center justify-center lg:justify-start gap-2 text-on-surface-variant">
<span aria-hidden="true" class="material-symbols-outlined text-[16px] text-secondary">lock</span>
<span class="font-label-md text-label-md">Bank-grade AES-256 encryption • POPIA compliant</span>
</div>
</section>
<!-- Right Panel: Sign Up Form -->
<section class="bg-surface-container-lowest flex flex-col justify-center p-8 lg:p-12 xl:p-16">
<div class="w-full max-w-[420px] mx-auto">
<div class="mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">
            Create your family vault
          </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
            Protect your policies and give your loved ones clarity.
          </p>
</div>
<form class="flex flex-col gap-5" id="lefa-signup-form" novalidate="">
<!-- Field 1: Full name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="full-name">
              Full name
            </label>
<input autocomplete="name" class="w-full h-12 px-4 rounded-[10px] bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" id="full-name" name="fullName" placeholder="e.g. Thabo Molefe" required="" type="text"/>
</div>
<!-- Field 2: Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">
              Email
            </label>
<input autocomplete="email" class="w-full h-12 px-4 rounded-[10px] bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" id="email" name="email" placeholder="thabo@example.co.za" required="" type="email"/>
</div>
<!-- Field 3: Phone with +27 prefix -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="phone">
              Phone
            </label>
<div class="flex items-center w-full h-12 rounded-[10px] bg-surface-container-low focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all overflow-hidden">
<span class="h-full px-3.5 flex items-center justify-center bg-surface-container text-on-surface-variant font-body-sm-medium text-body-sm-medium select-none">
                +27
              </span>
<input autocomplete="tel-national" class="w-full h-full px-3.5 bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none" id="phone" name="phone" placeholder="82 123 4567" required="" type="tel"/>
</div>
</div>
<!-- Field 4: Password with eye toggle & 4-segment strength bar -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="password">
              Password
            </label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full h-12 pl-4 pr-12 rounded-[10px] bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" id="password" name="password" placeholder="Create a strong password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 w-8 h-8 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-primary-container transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggle-password-icon">visibility</span>
</button>
</div>
<!-- 4-segment strength bar -->
<div aria-hidden="true" class="grid grid-cols-4 gap-1.5 mt-1">
<div class="h-1 rounded-full bg-surface-container-high transition-colors duration-300" id="strength-seg-1"></div>
<div class="h-1 rounded-full bg-surface-container-high transition-colors duration-300" id="strength-seg-2"></div>
<div class="h-1 rounded-full bg-surface-container-high transition-colors duration-300" id="strength-seg-3"></div>
<div class="h-1 rounded-full bg-surface-container-high transition-colors duration-300" id="strength-seg-4"></div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5" id="password-hint">
              At least 8 characters, including a number and symbol
            </p>
</div>
<!-- POPIA Checkbox -->
<label class="flex items-start gap-3 cursor-pointer mt-1">
<input class="mt-1 w-4 h-4 rounded accent-primary-container cursor-pointer" id="popia-consent" required="" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">
              I agree to the <a class="text-primary-container font-body-sm-medium text-body-sm-medium hover:underline" href="#privacy-popia">privacy notice (POPIA)</a>
</span>
</label>
<!-- Primary CTA Button -->
<button class="w-full h-12 mt-2 rounded-[10px] bg-primary-container text-on-primary font-body-md-semibold text-body-md-semibold hover:bg-primary transition-colors shadow-sm flex items-center justify-center gap-2 cursor-pointer" id="submit-btn" type="submit">
<span>Create my vault</span>
</button>
</form>
<!-- Bottom Log in link -->
<p class="font-body-sm text-body-sm text-on-surface-variant text-center mt-8">
          Already have a vault?
          <a class="text-primary-container font-body-sm-medium text-body-sm-medium hover:underline ml-1" href="#login">Log in</a>
</p>
</div>
</section>
</div>
</div>
<script>
  (function () {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const toggleIcon = document.getElementById('toggle-password-icon');
    const segments = [
      document.getElementById('strength-seg-1'),
      document.getElementById('strength-seg-2'),
      document.getElementById('strength-seg-3'),
      document.getElementById('strength-seg-4')
    ];
    const form = document.getElementById('lefa-signup-form');
    const submitBtn = document.getElementById('submit-btn');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (passwordInput) {
      passwordInput.addEventListener('input', function () {
        const val = passwordInput.value;
        let score = 0;
        if (val.length >= 4) score++;
        if (val.length >= 8) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const activeColor = score <= 1 ? 'bg-error' : score <= 2 ? 'bg-secondary-container' : 'bg-primary-container';

        segments.forEach(function (seg, idx) {
          seg.classList.remove('bg-surface-container-high', 'bg-error', 'bg-secondary-container', 'bg-primary-container');
          if (idx < score) {
            seg.classList.add(activeColor);
          } else {
            seg.classList.add('bg-surface-container-high');
          }
        });
      });
    }

    if (form && submitBtn) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Creating your vault...</span>';
        submitBtn.disabled = true;
        setTimeout(function () {
          submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span>Vault created</span>';
        }, 1200);
      });
    }
  })();
</script></main></body></html>
